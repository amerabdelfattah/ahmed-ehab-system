<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نموذج سيستم الكابتن أحمد إيهاب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =============================================================
   variables.css · سيستم الكابتن أحمد إيهاب · Design Tokens v1.0
   الاستخدام: <html lang="ar" dir="rtl" data-theme="light|dark">
   بدون data-theme = تلقائي (بيمشي على إعداد الجهاز)
   ============================================================= */

/* ---------- 1) توكينز ثابتة في الوضعين ---------- */
:root{
  /* الخطوط */
  --font-display:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-ui:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extrabold:800;
  --lh-body:1.65; --lh-heading:1.3; --lh-display:1.1;

  /* سلم الأحجام (موبايل) */
  --fs-display:36px; --fs-h1:24px; --fs-h2:18px; --fs-h3:16px;
  --fs-body:16px; --fs-small:13px; --fs-min:12px;

  /* المسافات (أساس 4px) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px;

  /* الزوايا */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:999px;

  /* الحركة */
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:120ms; --t-normal:200ms; --t-slow:300ms;

  /* الطبقات */
  --z-content:0; --z-sticky:20; --z-tabbar:30; --z-sheet:50; --z-modal:60; --z-toast:80;

  /* المقاسات */
  --tap-min:44px;
  --btn-h:48px; --input-h:48px;
  --topbar-h:56px; --tabbar-h:64px;
  --sidebar-w:240px; --sidebar-w-collapsed:72px;
  --content-max:1200px; --form-max:720px;
  --drawer-w:420px; --modal-w:480px; --modal-w-lg:640px;

  /* Breakpoints (للتوثيق، مش بتشتغل جوه @media): 768 تابلت · 1024 ديسكتوب · 1440 واسع */
  --bp-tablet:768px; --bp-desktop:1024px; --bp-wide:1440px;

  /* ثابتة */
  --shadow-fab:0 6px 16px rgba(255,106,19,.40);

  /* ألوان الـ PDF (فاتحة دايمًا حتى في الوضع الداكن) */
  --pdf-bg:#FFFFFF; --pdf-text:#1B2430; --pdf-border:#E4E9E6;
  --pdf-p:#5B3FE0; --pdf-c:#0B7F73; --pdf-f:#1D4ED8;
  --pdf-main:#0F1B2D; --pdf-soft:#E8EDF3; /* القالب الافتراضي: كحلي حبر */
}

/* ---------- 2) الوضع الفاتح ---------- */
:root,[data-theme="light"]{
  /* أسطح ونصوص */
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#FFFFFF; --border:#E3E8EE;
  --text:#0F1B2D; --text-muted:#5B6B7C;

  /* الأكسنت (البرتقالي = اضغط هنا بس) */
  --accent:#FF6A13; --accent-hover:#E55200; --accent-soft:#FFF0E6;
  --accent-text:#C24A00;   /* الأكسنت كنص أو رابط */
  --on-accent:#0F1B2D;     /* النص فوق الأكسنت: كحلي دايمًا */
  --focus:#FF6A13;         /* حلقة التركيز: 2px مع إزاحة 2px */

  /* أسطح خاصة */
  --sidebar-bg:#0F1B2D; --sidebar-text:#C9D5E2;
  --sidebar-active-bg:rgba(255,106,19,.16); --sidebar-active-text:#FF9A5C;
  --total-bg:#0F1B2D; --total-text:#FFFFFF; --total-muted:#9FB0C3;
  --track:#E7ECF0; --overlay:rgba(15,27,45,.50); --skeleton:#E7ECF0;

  /* الماكروز: fill للأشرطة والنقاط، text للأرقام */
  --macro-p:#7C5CFF; --macro-p-text:#5B3FE0;
  --macro-c:#14B8A6; --macro-c-text:#0B7F73;
  --macro-f:#3B82F6; --macro-f-text:#1D4ED8;

  /* الحالات */
  --ok-text:#166534;     --ok-bg:#DCFCE7;
  --warn-text:#92400E;   --warn-bg:#FEF3C7;
  --danger:#DC2626;      --danger-text:#991B1B; --danger-bg:#FEE2E2;
  --info-text:#1E40AF;   --info-bg:#DBEAFE;

  /* الظلال (في الفاتح بس) */
  --shadow-1:0 1px 2px rgba(15,27,45,.06);
  --shadow-2:0 8px 24px rgba(15,27,45,.10);
}

/* ---------- 3) الوضع الداكن (يدوي) ---------- */
[data-theme="dark"]{
  --bg:#0B1220; --surface:#131C2E; --surface-2:#1A2540; --border:#223048;
  --text:#E8EEF5; --text-muted:#93A3B5;
  --accent-hover:#FF8540; --accent-soft:#2A1A10; --accent-text:#FF8540; --focus:#FF8540;
  --sidebar-bg:#070D18; --total-bg:#1A2540;
  --track:#26364C; --overlay:rgba(0,0,0,.65); --skeleton:#1F2B42;
  --macro-p:#9B85FF; --macro-p-text:#9B85FF;
  --macro-c:#2DD4BF; --macro-c-text:#2DD4BF;
  --macro-f:#60A5FA; --macro-f-text:#60A5FA;
  --ok-text:#4ADE80;     --ok-bg:rgba(34,197,94,.15);
  --warn-text:#FBBF24;   --warn-bg:rgba(245,158,11,.15);
  --danger:#F87171;      --danger-text:#F87171; --danger-bg:rgba(220,38,38,.18);
  --info-text:#93C5FD;   --info-bg:rgba(59,130,246,.15);
  --shadow-1:none; --shadow-2:none;
}

/* ---------- 4) الوضع الداكن (تلقائي: لو المستخدم ما اختارش) ---------- */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#131C2E; --surface-2:#1A2540; --border:#223048;
    --text:#E8EEF5; --text-muted:#93A3B5;
    --accent-hover:#FF8540; --accent-soft:#2A1A10; --accent-text:#FF8540; --focus:#FF8540;
    --sidebar-bg:#070D18; --total-bg:#1A2540;
    --track:#26364C; --overlay:rgba(0,0,0,.65); --skeleton:#1F2B42;
    --macro-p:#9B85FF; --macro-p-text:#9B85FF;
    --macro-c:#2DD4BF; --macro-c-text:#2DD4BF;
    --macro-f:#60A5FA; --macro-f-text:#60A5FA;
    --ok-text:#4ADE80;     --ok-bg:rgba(34,197,94,.15);
    --warn-text:#FBBF24;   --warn-bg:rgba(245,158,11,.15);
    --danger:#F87171;      --danger-text:#F87171; --danger-bg:rgba(220,38,38,.18);
    --info-text:#93C5FD;   --info-bg:rgba(59,130,246,.15);
    --shadow-1:none; --shadow-2:none;
  }
}

/* ---------- 5) الديسكتوب (1024+): أحجام الخط وارتفاع العناصر ---------- */
@media (min-width:1024px){
  :root{
    --fs-display:40px; --fs-h1:30px; --fs-h2:20px; --fs-h3:17px; --fs-body:15px;
    --btn-h:40px; --input-h:40px;
  }
}

/* ---------- 6) قوالب الـ PDF (3 قوالب، الأكسنت هو الخط تحت الهيدر) ---------- */
.pdf-navy    { --pdf-main:#0F1B2D; --pdf-soft:#E8EDF3; }
.pdf-royal   { --pdf-main:#243B6B; --pdf-soft:#E7ECF6; }
.pdf-charcoal{ --pdf-main:#2B2B2B; --pdf-soft:#EFEDEA; }

/* ---------- 7) قواعد عامة على مستوى التوكينز ---------- */
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
@media print{ .pdf-sheet,.paper{ -webkit-print-color-adjust:exact; print-color-adjust:exact; } }

*{box-sizing:border-box;margin:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:var(--lh-body);font-variant-numeric:tabular-nums}
h1,h2,.display{font-family:var(--font-display);line-height:var(--lh-heading)}
h1{font-size:var(--fs-h1);font-weight:800}h2{font-size:var(--fs-h2);font-weight:700}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-muted)}.sm{font-size:var(--fs-small)}
.num{direction:ltr;display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center}
/* .ic موجودة في Base */
.btn{min-height:var(--btn-h);min-width:var(--tap-min);padding:0 var(--s-5);border:1px solid transparent;border-radius:var(--r-md);font:600 var(--fs-body) var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);cursor:pointer;transition:background var(--t-fast) var(--ease)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-link{background:none;color:var(--accent-text)}
.btn-danger{background:none;border-color:var(--danger);color:var(--danger)}
.field{display:flex;flex-direction:column;gap:var(--s-1);margin-bottom:var(--s-3)}
.field label{font-size:var(--fs-small);font-weight:500}
.input{min-height:var(--input-h);width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-md);padding:0 var(--s-3);font:var(--fs-body) var(--font-ui)}
.input:focus{outline:0;border:2px solid var(--focus)}
.input.is-error{border-color:var(--danger)}
.input:disabled{opacity:.45}
.field-msg{font-size:var(--fs-small);color:var(--danger-text)}
.chip{min-height:var(--tap-min);padding:0 var(--s-4);display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--r-full);background:var(--surface);color:var(--text);font:500 var(--fs-small) var(--font-ui);cursor:pointer}
.chip.is-on{background:var(--text);color:var(--bg);border-color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:var(--s-1);padding:2px var(--s-3);border-radius:var(--r-full);font-size:var(--fs-min);font-weight:600}
.badge-ok{background:var(--ok-bg);color:var(--ok-text)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text)}
.badge-danger{background:var(--danger-bg);color:var(--danger-text)}
.badge-info{background:var(--info-bg);color:var(--info-text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-4);box-shadow:var(--shadow-1)}
.list-row{display:flex;align-items:center;gap:var(--s-3);min-height:56px;padding-block:var(--s-2);border-bottom:1px solid var(--border)}
.list-row:last-child{border:0}
.list-row__body{flex:1;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border)}
.tab{white-space:nowrap;min-height:var(--tap-min);padding:var(--s-3) var(--s-4);background:none;border:0;border-bottom:3px solid transparent;color:var(--text-muted);font:500 var(--fs-body) var(--font-ui);cursor:pointer}
.tab.is-on{color:var(--accent-text);font-weight:600;border-color:var(--accent)}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:var(--s-3);padding-inline:var(--s-2) var(--s-4);background:var(--surface);border-bottom:1px solid var(--border)}
.back{display:flex;align-items:center;gap:var(--s-1);min-height:var(--tap-min);min-width:var(--tap-min);padding-inline:var(--s-2);background:none;border:0;color:var(--accent-text);font:600 var(--fs-body) var(--font-ui);cursor:pointer}
.tabbar{height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:var(--z-tabbar)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-min);font-weight:500;color:var(--text-muted);text-decoration:none}
.tabbar a.is-on{color:var(--accent-text);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.fab{position:fixed;inset-block-end:calc(var(--tabbar-h) + var(--s-4));inset-inline-end:var(--s-4);width:56px;height:56px;border-radius:var(--r-full);border:0;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-fab);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:var(--z-tabbar)}
.stepper{display:flex;align-items:center;gap:var(--s-1);min-height:56px;border-bottom:1px solid var(--border)}
.stepper__name{flex:1;min-width:0}
.stepper__qty{min-width:56px;text-align:center}
.icon-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.total{background:var(--total-bg);color:var(--total-text);border-radius:var(--r-lg);padding:var(--s-4)}
.total .muted{color:var(--total-muted)}
.total__num{font:800 var(--fs-display)/var(--lh-display) var(--font-display)}
.macro-bar{display:flex;height:8px;border-radius:var(--r-full);overflow:hidden;background:var(--track);margin-top:var(--s-3)}
.macro-p{background:var(--macro-p)}.macro-c{background:var(--macro-c)}.macro-f{background:var(--macro-f)}
.macro-legend{display:flex;gap:var(--s-3);flex-wrap:wrap;font-size:var(--fs-small);margin-top:var(--s-3)}
.macro-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.text-p{color:var(--macro-p-text)}.text-c{color:var(--macro-c-text)}.text-f{color:var(--macro-f-text)}
.sheet-wrap{position:fixed;inset:0;z-index:var(--z-sheet);display:flex;align-items:flex-end;visibility:hidden}
.sheet-ov{position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity var(--t-normal) var(--ease)}
.sheet{position:relative;width:100%;max-height:85%;overflow:auto;background:var(--surface-2);border-top:1px solid var(--border);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--s-3) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-2);transform:translateY(100%);transition:transform var(--t-slow) var(--ease)}
.sheet__grab{width:36px;height:4px;border-radius:var(--r-full);background:var(--border);margin:0 auto var(--s-3)}
.sheet-wrap.open{visibility:visible}
.sheet-wrap.open .sheet-ov{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.dialog-wrap{position:fixed;inset:0;z-index:var(--z-modal);display:none;align-items:center;justify-content:center;padding:var(--s-4);background:var(--overlay)}
.dialog-wrap.open{display:flex}
.dialog{width:100%;max-width:var(--modal-w);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-5);box-shadow:var(--shadow-2)}
.toast-host{position:fixed;inset-inline:var(--s-4);inset-block-end:calc(var(--tabbar-h) + var(--s-4));z-index:var(--z-toast);display:flex;flex-direction:column;gap:var(--s-2);pointer-events:none}
.toast{background:var(--text);color:var(--bg);border-radius:var(--r-md);padding:var(--s-3) var(--s-4);display:flex;gap:var(--s-3);align-items:center}
.skeleton{height:14px;border-radius:var(--r-sm);background:var(--skeleton);margin-bottom:var(--s-2);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.empty{text-align:center;padding:var(--s-6) var(--s-4)}
.empty .ic{width:40px;height:40px;color:var(--text-muted)}
.empty p{margin:var(--s-2) 0 var(--s-3)}
.offline{display:flex;gap:var(--s-2);align-items:center;background:var(--warn-bg);color:var(--warn-text);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);font-weight:500}
.autosave{display:inline-flex;gap:var(--s-1);align-items:center;font-size:var(--fs-small);color:var(--ok-text);font-weight:500}
.switch{width:44px;height:26px;border-radius:var(--r-full);background:var(--track);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--border);transition:inset-inline-start var(--t-fast) var(--ease)}
.switch.is-on{background:var(--text)}
.switch.is-on::after{inset-inline-start:21px;background:var(--bg)}
.checkbox{width:24px;height:24px;border:2px solid var(--border);border-radius:var(--r-sm);background:none;flex:none;cursor:pointer}
.checkbox.is-on{background:var(--text);border-color:var(--text)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:start;font-size:var(--fs-small);font-weight:500;color:var(--text-muted);padding:var(--s-3);border-bottom:1px solid var(--border)}
.table td{padding:var(--s-3);border-bottom:1px solid var(--border)}
.alert{display:flex;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-radius:var(--r-md);margin-bottom:var(--s-2)}
.alert-danger{background:var(--danger-bg);color:var(--danger-text)}
.alert-warn{background:var(--warn-bg);color:var(--warn-text)}
.alert-ok{background:var(--ok-bg);color:var(--ok-text)}
.alert-info{background:var(--info-bg);color:var(--info-text)}
.steps{display:flex;gap:var(--s-1)}
.steps i{flex:1;height:4px;border-radius:var(--r-full);background:var(--track)}
.steps i.is-on{background:var(--text)}
.otp{display:flex;gap:var(--s-2);direction:ltr;justify-content:center}

.otp input:focus{outline:0;border:2px solid var(--focus)}
.bubble{max-width:80%;width:fit-content;padding:var(--s-2) var(--s-3);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);margin-bottom:var(--s-2)}
.bubble-me{margin-inline-start:auto;background:var(--track);border-color:var(--track)}
.composer{display:flex;gap:var(--s-2)}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--sidebar-text);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-1);transition:width var(--t-normal) var(--ease)}
.sidebar a{display:flex;align-items:center;gap:var(--s-3);min-height:var(--tap-min);padding:var(--s-3);border-radius:var(--r-md);color:inherit;text-decoration:none}
.sidebar a.is-on{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);font-weight:600}
.sidebar .icon-btn{background:none;border-color:transparent;color:inherit}
.sidebar.is-collapsed{width:var(--sidebar-w-collapsed)}
.sidebar.is-collapsed span{display:none}
.topbar-d{height:var(--topbar-h);display:flex;align-items:center;gap:var(--s-4);padding-inline:var(--s-6);background:var(--surface);border-bottom:1px solid var(--border)}
.paper{max-width:595px;margin:0 auto;background:var(--pdf-bg);color:var(--pdf-text);border:1px solid var(--pdf-border);border-radius:var(--r-sm);padding:var(--s-4);font-size:var(--fs-small);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper__head{background:var(--pdf-main);color:var(--pdf-bg);padding:var(--s-3) var(--s-4);border-bottom:3px solid var(--accent);margin:calc(var(--s-4)*-1) calc(var(--s-4)*-1) var(--s-3);font-family:var(--font-display)}
.paper__macros{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2);text-align:center;margin-bottom:var(--s-3)}
.paper__macros>div{background:var(--pdf-soft);border-radius:var(--r-sm);padding:var(--s-2)}
.paper__row{display:flex;flex-direction:column;padding:var(--s-2) 0;border-bottom:1px solid var(--pdf-border)}
.shell{display:flex;min-height:100vh}.main{flex:1;min-width:0}
.sidebar{display:none;position:sticky;top:0;height:100vh;flex:none}
.sidebar .logo{color:var(--total-text);font:800 16px var(--font-display);padding:var(--s-2) var(--s-3) var(--s-4)}
.topbar{position:sticky;top:0;z-index:var(--z-sticky)}.topbar b{font:700 var(--fs-h3) var(--font-display)}
.page{padding:var(--s-4) var(--s-4) 110px;max-width:var(--content-max);margin:0 auto}
.tabbar{position:fixed;inset-inline:0;bottom:0}.tabbar a{cursor:pointer}

pm:d=>{ST.pdf.m=d.v;rr()},pc:d=>{ST.pdf.c=d.v;rr()},print:()=>{try{print()}catch(e){toast('الطباعة بتشتغل من المتصفح','info')}},
nf:()=>fsheet(),ef:d=>fsheet(F[+d.v]),nx:()=>xsheet(),ee:d=>xsheet(X[+d.v]),
savef:d=>{const n=$('#fn').value.trim();if(!n)return toast('اكتب اسم الصنف','alert');const o={n,cat:$('#fct').value,k:+$('#fk').value||0,p:+$('#fp').value||0,c:+$('#fcc').value||0,f:+$('#ff').value||0};if(d.v!==''){Object.assign(F[+d.v],o);unsheet();toast('اتحفظ التعديل')}else{F.push({id:F.length,...o});unsheet();toast('اتضاف '+n)}rr()},
savex:d=>{const n=$('#xn').value.trim();if(!n)return toast('اكتب اسم التمرين','alert');const o={n,m:$('#xm').value,eq:$('#xe').value,d:$('#xd').value};if(d.v!==''){Object.assign(X[+d.v],o);unsheet();toast('اتحفظ التعديل')}else{X.push({id:X.length,...o});unsheet();toast('اتضاف '+n)}rr()},
dfd:d=>{const id=+d.v,f=F[id],n=used('f',id);dlg('تحذف '+E(f.n)+'؟',n?`الصنف ده مستخدم في ${n} برنامج وهيتشال منهم كلهم.`:'الصنف هيتمسح من المكتبة.','احذف الصنف',()=>{f.del=1;C.forEach(c=>c.meals.forEach(m=>m.it=m.it.filter(i=>i.f!=id)));toast('اتحذف الصنف','info');lb()},1)},
dxd:d=>{const id=+d.v,e=X[id],n=used('x',id);dlg('تحذف '+E(e.n)+'؟',n?`التمرين ده مستخدم في ${n} برنامج وهيتشال منهم كلهم.`:'التمرين هيتمسح من المكتبة.','احذف التمرين',()=>{e.del=1;C.forEach(c=>c.days.forEach(d=>d.ex=d.ex.filter(x=>x.x!=id)));toast('اتحذف التمرين','info');lb()},1)},
ptab:d=>{ST.pt=+d.v;rr()},eat:d=>{ST.eaten[d.v]=!ST.eaten[d.v];rr()},done:d=>{ST.done[d.v]=!ST.done[d.v];rr()},
};
const lb=()=>nav(ST.prev&&ST.prev.startsWith('#/library')?'back':'#/library',1);
const fsheet=f=>sheet(`<div class="sheet__grab"></div><b>${f?'تعديل الصنف':'صنف جديد'}</b><div style="margin-top:12px">${frm('fn','الاسم',f?E(f.n):'')}<div class="g2">${frm('fk','سعرات لكل 100 جم',f?String(f.k):'','inputmode="numeric"')}${frm('fp','بروتين',f?String(f.p):'','inputmode="numeric"')}${frm('fcc','كارب',f?String(f.c):'','inputmode="numeric"')}${frm('ff','دهون',f?String(f.f):'','inputmode="numeric"')}</div><div class="field"><label>التصنيف</label><select class="input" id="fct">${CATS.slice(1).map(k=>`<option ${f&&f.cat==k?'selected':''}>${k}</option>`).join('')}</select></div><button class="btn btn-primary" style="width:100%" data-a="savef" data-v="${f?f.id:''}">${f?'احفظ التعديل':'احفظ الصنف'}</button></div>`);
const xsheet=e=>sheet(`<div class="sheet__grab"></div><b>${e?'تعديل التمرين':'تمرين جديد'}</b><div style="margin-top:12px">${frm('xn','اسم التمرين',e?E(e.n):'')}<div class="field"><label>العضلة</label><select class="input" id="xm">${MUS.slice(1).map(k=>`<option ${e&&e.m==k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>المعدات</label><select class="input" id="xe">${EQ.map(k=>`<option ${e&&e.eq==k?'selected':''}>${k}</option>`).join('')}</select></div>${frm('xd','الشرح',e?E(e.d||''):'')}<div class="ph" style="min-height:80px;margin-bottom:12px">فيديو التمرين (الرفع في النسخة الحقيقية)</div><button class="btn btn-primary" style="width:100%" data-a="savex" data-v="${e?e.id:''}">${e?'احفظ التعديل':'احفظ التمرين'}</button></div>`);
const xs=()=>sheet(`<div class="sheet__grab"></div><b>اختار تمرين</b><input class="input" data-q="xs" placeholder="ابحث عن تمرين" value="${E(ST.xq)}" style="margin:12px 0">${chips(MUS,ST.xc,'xc')}<div id="xl">${xl()}</div>`);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b,e)});
document.addEventListener('input',e=>{const q=e.target.dataset.q;if(!q)return;const v=e.target.value;
if(q=='cl'){ST.q=v;$('#list').innerHTML=clist()}else if(q=='fd'){ST.fq=v;$('#fl').innerHTML=fl()}else if(q=='xs'){ST.xq=v;$('#xl').innerHTML=xl()}else if(q=='lib'){ST.lq=v;$('#ll').innerHTML=ll()}else if(q=='note'){ST.pdf.note=v;$('#pp').innerHTML=paper(cur())}});
if(!location.hash)location.replace('#/login');else render();
</script>
</body>
</html>
